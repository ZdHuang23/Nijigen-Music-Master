name: Build Android APK

on:
  push:
    branches:
      - master
      - cursor/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unity Android (ARM)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space (Android images are large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build APK with game-ci
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2019.4.20f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: AndroidBuild.BuildApk
          customParameters: -nographics

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NijigenMusicMaster-Android-apk
          path: |
            build/Android/**/*.apk
            build/android/**/*.apk
          if-no-files-found: warn
